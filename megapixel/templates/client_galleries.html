{% extends "base.html" %}

{% block content %}

<section class="max-w-6xl mx-auto py-16 px-4">

<h1 class="text-3xl font-semibold mb-10">My Galleries</h1>

<div class="grid md:grid-cols-3 gap-6">

{% for gallery in galleries %}

<a href="{% url 'client_gallery_detail' gallery.id %}">

<div class="bg-white dark:bg-[#141414] p-6 rounded-xl shadow hover:scale-105 transition">

<h2 class="text-lg font-semibold">
{{ gallery.title }}
</h2>

<p class="text-gray-500 text-sm">
{{ gallery.description }}
</p>

</div>

</a>

{% endfor %}

</div>

</section>

{% endblock %}
