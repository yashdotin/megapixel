{% extends "admin/base_site.html" %}

{% block content %}
<div class="module">
    <h1>Bulk Upload Category Images</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div style="margin: 20px 0;">
            <label><strong>Category</strong></label><br>
            {{ form.category }}
        </div>

        <div style="margin: 20px 0;">
            <label><strong>Select Images</strong></label><br>
            {{ form.images }}
        </div>

        <input type="submit" value="Upload Images" class="default">
    </form>
</div>
{% endblock %}
